document.querySelector('.prev').onclick=e=>{e.stopPropagation();move(-1)};document.querySelector('.next').onclick=e=>{e.stopPropagation();move(1)};

document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key==='Home'){index=0;render()}else if(e.key==='End'){index=cards.length-1;render()}});
document.getElementById('download').onclick=()=>{const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='archetype-cards.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
