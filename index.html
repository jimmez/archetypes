function render(){const c=cards[index];el('title').textContent=c[0];el('light').textContent=c[1];el('dark').textContent=c[2];el('counter').textContent=(index+1)+' / '+cards.length;document.documentElement.style.setProperty('--accent',`hsl(${(index*137.508+39)%360} 65% 74%)`);el('povs').replaceChildren(...points[index].map((text,i)=>{const li=document.createElement('li');li.className='pov '+(i%2?'dark':'light');li.textContent=text;return li}));el('card').classList.remove('arrive');void el('card').offsetWidth;el('card').classList.add('arrive');}
function seconds(){let value=Number(el('seconds').value);if(!Number.isFinite(value)||value<1)value=10;value=Math.min(300,value);el('seconds').value=value;return value}
function schedule(){clearTimeout(timer);timer=null;if(playing)timer=setTimeout(()=>{next(true);schedule()},seconds()*1000)}
function updatePlay(){el('status').textContent=playing?'Playing Â· '+seconds()+'s':'Stopped';el('play').disabled=playing;el('stop').disabled=!playing}
function setPlaying(value){playing=value;updatePlay();schedule()}
function showCardScroll(){el('screen').scrollIntoView({behavior:'instant',block:'start'})}
function select(value,manual){index=value;render();if(manual){showCardScroll();schedule()}}
function next(automatic=false){if(cursor<history.length-1){cursor++;select(history[cursor],!automatic);return}let value;if(automatic&&el('random').checked){value=Math.floor(Math.random()*(cards.length-1));if(value>=index)value++}else value=(index+1)%cards.length;history.push(value);cursor++;select(value,!automatic)}
function previous(){if(cursor>0){cursor--;select(history[cursor],true)}else{const value=(index-1+cards.length)%cards.length;history.unshift(value);select(value,true)}}

el('card').addEventListener('click',e=>{if(Date.now()<suppressClickUntil||window.getSelection().toString())return;const rect=el('card').getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width;if(x<1/3)previous();else if(x>2/3)next();else setPlaying(!playing)});
